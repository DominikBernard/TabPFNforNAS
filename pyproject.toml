[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tabpfn-for-nas"
version = "0.1.0"
description = "Diploma thesis project"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["tabpfn_with_nats_bench*", "tabpfn_learning_curves*", "rl_with_atbpfn*"]